# Tailscale 安卓手机。编译步骤对齐 tailscale-android-builder/scripts/build-android.sh。
# apk 放进镜像的 /payload，拉取后 docker run -v 当前目录:/out 即得到 tailscale.apk。
name: build-tailscale-android

on:
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        default: "1.102.4"

permissions:
  contents: read

concurrency:
  group: build-tailscale-android-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: ref
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          case "$INPUT_REF" in
            ""|*[!A-Za-z0-9_.-]*)
              echo "::error::ref 为空或含镜像 tag 不支持的字符: $INPUT_REF"
              exit 1
              ;;
          esac
          upstream="$INPUT_REF"
          version="$INPUT_REF"
          if [[ "$INPUT_REF" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            remote="$(git ls-remote --tags https://github.com/tailscale/tailscale-android.git "refs/tags/${version}*")"
            mapfile -t tags < <(
              printf '%s\n' "$remote" \
                | awk 'NF { print $2 }' \
                | sed -E 's#^refs/tags/##; s#\^\{\}$##' \
                | { grep -E "^${version}([-+].*)?$" || true; } \
                | sort -u
            )
            if [ "${#tags[@]}" -ne 1 ]; then
              echo "::error::版本 ${version} 对应 ${#tags[@]} 个标签: ${tags[*]:-无}"
              exit 1
            fi
            upstream="${tags[0]}"
          elif [[ "$INPUT_REF" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)[-+].+$ ]]; then
            version="${BASH_REMATCH[1]}"
          fi
          case "$upstream" in
            ""|*[!A-Za-z0-9_.-]*)
              echo "::error::解析出的 ref 不能检出: $upstream"
              exit 1
              ;;
          esac
          echo "UPSTREAM_REF=$upstream" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "检出 ${upstream}，请求版本 ${version}"
          repo="https://github.com/tailscale/tailscale-android.git"
          if git ls-remote "$repo" "refs/heads/$upstream" | grep -q . \
             && ! git ls-remote --refs "$repo" "refs/tags/$upstream" | grep -q .; then
            echo "::error::不能检出分支，请填写已发布的 Git 标签: $upstream"
            exit 1
          fi
          if ! git ls-remote --refs "$repo" "refs/tags/$upstream" | grep -q .; then
            echo "::error::ref 必须对应已发布的 Git 标签: $upstream"
            exit 1
          fi

      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost \
                      /usr/local/lib/android/sdk/system-images \
                      /usr/local/lib/android/sdk/emulator || true
          df -h / | tail -1

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          repository: tailscale/tailscale-android
          ref: ${{ env.UPSTREAM_REF }}
          path: tailscale-android-builder/upstream/tailscale-android
          fetch-depth: 1
          persist-credentials: false

      - name: customize
        run: |
          bash tailscale-android-builder/scripts/apply-headscale-customization.sh \
            tailscale-android-builder/upstream/tailscale-android

      - name: customize verify
        run: |
          set -euo pipefail
          up=tailscale-android-builder/upstream/tailscale-android/android/src/main
          test -f "$up/java/com/tailscale/ipn/headscale/HeadscaleConfigDialog.kt"
          test -f "$up/java/com/tailscale/ipn/headscale/BootCompletedReceiver.kt"
          grep -q 'headscale.BootCompletedReceiver' tailscale-android-builder/upstream/tailscale-android/android/src/main/AndroidManifest.xml
          grep -q 'HeadscaleConfigDialog' tailscale-android-builder/upstream/tailscale-android/android/src/main/java/com/tailscale/ipn/ui/view/MainView.kt
          grep -q 'RECEIVE_BOOT_COMPLETED' tailscale-android-builder/upstream/tailscale-android/android/src/main/AndroidManifest.xml
          echo "Headscale 定制资源与补丁已合入"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: tailscale-android-builder/android-sdk
          key: tailscale-android-sdk-${{ hashFiles('tailscale-android-builder/upstream/tailscale-android/android/gradle.properties') }}
          restore-keys: |
            tailscale-android-sdk-

      - name: Cache Go toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/tailscale-go
          key: tailscale-go-${{ hashFiles('tailscale-android-builder/upstream/tailscale-android/go.toolchain.rev') }}
          restore-keys: |
            tailscale-go-

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: tailscale-go-mod-${{ hashFiles('tailscale-android-builder/upstream/tailscale-android/go.sum') }}
          restore-keys: |
            tailscale-go-mod-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: tailscale-gradle-${{ hashFiles('tailscale-android-builder/upstream/tailscale-android/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            tailscale-gradle-

      - name: keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/keystore.jks" \
            -storetype PKCS12 -storepass android -keypass android \
            -alias tailscale -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Tailscale Self Build, OU=android, O=self-build, C=CN"

      - name: apk
        env:
          BUILD_TYPE: release
          SKIP_UPSTREAM_CHECKOUT: "1"
          SKIP_HEADSCALE_CUSTOMIZATION: "1"
          UPSTREAM_REF: ${{ env.UPSTREAM_REF }}
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: android
          KEY_PASSWORD: android
          KEY_ALIAS: tailscale
        run: |
          exact_tag="$(git -C tailscale-android-builder/upstream/tailscale-android describe --tags --exact-match)"
          test "$exact_tag" = "$UPSTREAM_REF"
          bash tailscale-android-builder/scripts/build-android.sh

      - name: pack
        run: |
          set -euo pipefail
          info=tailscale-android-builder/out/build-info.txt
          short="$(sed -n 's/^tailscale_version_short=//p' "$info" | tr -d '[:space:]')"
          long="$(sed -n 's/^tailscale_version=//p' "$info" | tr -d '[:space:]')"
          version=""
          if [[ "$short" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="$short"
          elif [[ "$long" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            version="${BASH_REMATCH[1]}"
          fi
          if [ -z "$version" ]; then
            echo "::error::无法从构建信息得到主版本: short=$short long=$long"
            exit 1
          fi
          if [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ "$version" != "$RELEASE_VERSION" ]; then
            echo "::error::构建版本 ${version} 与请求的 ${RELEASE_VERSION} 不一致"
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "发布版本 ${version}（上游 ${UPSTREAM_REF}）"
          mapfile -t apks < <(find tailscale-android-builder/out -name '*.apk' -type f | sort)
          printf '%s\n' "${apks[@]}"
          test "${#apks[@]}" -eq 1
          mkdir -p pkg/payload
          cp "${apks[0]}" pkg/payload/tailscale.apk
          ls -lh pkg/payload

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: login
        run: |
          echo "${{ secrets.ALIYUN_PASSWORD }}" | docker login --username="${{ secrets.ALIYUN_USERNAME }}" --password-stdin registry.cn-hangzhou.aliyuncs.com

      - name: push
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
        run: |
          cat > pkg/Dockerfile <<'EOF'
          FROM alpine:3.22
          COPY payload/ /payload/
          ENTRYPOINT ["cp", "-a", "/payload/.", "/out/"]
          EOF
          buildx_push_retry() {
            local image="$1"
            shift
            local i
            for i in 1 2 3 4 5; do
              if docker buildx build \
                --tag "$image" \
                --provenance=false \
                --sbom=false \
                --output "type=registry,compression=gzip,force-compression=true,oci-mediatypes=true,compression-level=3" \
                "$@"; then
                return 0
              fi
              echo "::warning::docker push attempt ${i}/5 failed for ${image}"
              sleep $((i * 20))
            done
            echo "::error::docker push failed for ${image}; printing layer sizes"
            docker buildx build --tag "$image" --load --provenance=false --sbom=false "$@" || true
            docker images --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}' "$image" || true
            docker history --human --no-trunc --format 'table {{.Size}}\t{{.CreatedBy}}' "$image" || true
            docker buildx imagetools inspect "$image" || true
            return 1
          }
          image="registry.cn-hangzhou.aliyuncs.com/syncimage/tailscale-android:${RELEASE_VERSION}"
          buildx_push_retry "$image" pkg
          echo "已推送 ${image}"
          echo "下载: docker run --rm -v \"\${PWD}:/out\" ${image}"
