# 改 REGISTRY_PASSWORD 后务必递增 AUTH_BOOTSTRAP，并执行：
#   docker compose -f docker-acr-relay.yaml up -d --force-recreate auth-init registry relay
services:
  auth-init:
    image: "registry.cn-hangzhou.aliyuncs.com/syncimage/acr-relay:0.1.2"
    restart: "no"
    networks:
      - acrrelaynet
    environment:
      AUTH_BOOTSTRAP: "1"
      REGISTRY_USER: "github"
      REGISTRY_PASSWORD: "change-me-strong-password"
    volumes:
      - auth:/auth
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        htpasswd -Bbn "$$REGISTRY_USER" "$$REGISTRY_PASSWORD" > /auth/htpasswd
        chmod 644 /auth/htpasswd

  registry:
    image: "registry.cn-hangzhou.aliyuncs.com/syncimage/registry:3.1.2"
    container_name: acr-relay-registry
    restart: always
    networks:
      - acrrelaynet
    depends_on:
      auth-init:
        condition: service_completed_successfully
    ports:
      - 31005:5000
    environment:
      TZ: Asia/Shanghai
    volumes:
      - registry-data:/var/lib/registry
      - auth:/auth:ro
    configs:
      - source: registry-config
        target: /etc/distribution/config.yml
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "20m"

  relay:
    image: "registry.cn-hangzhou.aliyuncs.com/syncimage/acr-relay:0.1.2"
    container_name: acr-relay-sync
    init: true
    restart: always
    networks:
      - acrrelaynet
    depends_on:
      auth-init:
        condition: service_completed_successfully
      registry:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      LOCAL_REGISTRY: "registry:5000"
      REGISTRY_CONTAINER: acr-relay-registry
      GC_IMAGE: "registry.cn-hangzhou.aliyuncs.com/syncimage/registry:3.1.2"
      REGISTRY_CONFIG: "/etc/distribution/config.yml"
      REGISTRY_USER: "github"
      REGISTRY_PASSWORD: "change-me-strong-password"
      ALIYUN_REGISTRY: "registry.cn-hangzhou.aliyuncs.com"
      ALIYUN_USERNAME: ""
      ALIYUN_PASSWORD: ""
      FORWARD_PREFIX: "syncimage/"
      POLL_SECONDS: "15"
      COPY_TIMEOUT_SECONDS: "600"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "20m"

volumes:
  registry-data:
    name: acr-relay-data
  auth:
    name: acr-relay-auth

networks:
  acrrelaynet:
    driver: bridge

configs:
  registry-config:
    content: |
      version: 0.1
      log:
        level: info
        fields:
          service: registry
      storage:
        delete:
          enabled: true
        filesystem:
          rootdirectory: /var/lib/registry
        maintenance:
          uploadpurging:
            enabled: true
            age: 168h
            interval: 24h
            dryrun: false
      http:
        addr: :5000
        headers:
          X-Content-Type-Options: [nosniff]
      auth:
        htpasswd:
          realm: acr-relay
          path: /auth/htpasswd
      health:
        storagedriver:
          enabled: true
          interval: 10s
          threshold: 3
